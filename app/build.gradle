plugins {
    id 'com.android.application'
}

// Output filename for release APK
base {
    archivesName = "RavenSDR"
}

android {
    namespace 'com.jamesburnetthq.ravensdr'
    compileSdk 36

    defaultConfig {
        applicationId "com.jamesburnetthq.ravensdr"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.10.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions"
                cFlags   "-std=c11"
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-26"
            }
        }
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile     file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASS") ?: ""
                keyAlias      System.getenv("KEY_ALIAS")      ?: "ravensdr"
                keyPassword   System.getenv("KEY_PASS")       ?: ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
