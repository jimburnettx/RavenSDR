name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin SOURCE_DATE_EPOCH to the commit timestamp for deterministic builds.
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36"   \
            "build-tools;36.0.0"     \
            "ndk;27.2.12479018"      \
            "cmake;3.22.1"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-build-cache

      # Build a second time from clean and compare checksums to verify that
      # the build is reproducible — identical source must produce identical APK.
      - name: Verify reproducibility
        run: |
          APK1=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          HASH1=$(sha256sum "$APK1" | cut -d' ' -f1)
          ./gradlew clean assembleDebug --no-build-cache
          APK2=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          HASH2=$(sha256sum "$APK2" | cut -d' ' -f1)
          echo "Build 1: $HASH1"
          echo "Build 2: $HASH2"
          if [ "$HASH1" != "$HASH2" ]; then
            echo "REPRODUCIBILITY FAILED: builds differ"
            exit 1
          fi
          echo "Reproducible build verified"
