name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin SOURCE_DATE_EPOCH to the commit timestamp so every build of the
      # same tag produces identical ZIP entry timestamps in the APK.
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
               -O /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d "$HOME"
          echo "GRADLE_HOME=$HOME/gradle-8.9" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36"   \
            "build-tools;36.0.0"     \
            "ndk;27.2.12479018"      \
            "cmake;3.22.1"

      # Decode the base64 keystore secret and expose the path + passwords as
      # env vars that build.gradle's signingConfigs.release block reads.
      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          python3 -c "import base64,os; raw=os.environ['SIGNING_KEY']; c=''.join(raw.split()); print('SIGNING_KEY length:',len(c),'chars (expected ~5884)'); d=base64.b64decode(c); print('Decoded keystore:',len(d),'bytes (expected ~4408)'); open('/tmp/release.jks','wb').write(d)"
          echo "KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew assembleRelease --no-build-cache

      - name: Rename artifact with version tag
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "RavenSDR-${{ github.ref_name }}.apk"

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "RavenSDR-${{ github.ref_name }}.apk" > "RavenSDR-${{ github.ref_name }}.apk.sha256"
          APK_HASH=$(cut -d' ' -f1 "RavenSDR-${{ github.ref_name }}.apk.sha256")
          echo "APK_HASH=$APK_HASH" >> "$GITHUB_ENV"

      # Verify the APK: download it and its .sha256 file, then run: sha256sum -c RavenSDR-<version>.apk.sha256
      # Tags with a suffix (-test, -rc) are marked as pre-releases and won't
      # appear as "Latest" on the repo homepage. Using gh CLI creates the
      # release and uploads assets atomically, avoiding immutable-release errors.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-test"* ]]; then
            TITLE="TEST BUILD $TAG"
          elif [[ "$TAG" == *"-rc"* ]]; then
            TITLE="RavenSDR $TAG (Release Candidate)"
          else
            TITLE="RavenSDR $TAG"
          fi

          PRERELEASE=""
          [[ "$TAG" == *"-"* ]] && PRERELEASE="--prerelease"

          NOTES="## SHA-256 Checksum

          Verify the download with \`sha256sum -c RavenSDR-${TAG}.apk.sha256\` (Linux/macOS) or \`CertUtil -hashfile RavenSDR-${TAG}.apk SHA256\` (Windows).

          | File | SHA-256 |
          |------|---------|
          | \`RavenSDR-${TAG}.apk\` | \`${{ env.APK_HASH }}\` |"

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --generate-notes \
            $PRERELEASE \
            "RavenSDR-${TAG}.apk" \
            "RavenSDR-${TAG}.apk.sha256"
